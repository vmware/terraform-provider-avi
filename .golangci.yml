version: "2"
issues:
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - misspell
    - nakedret
    - govet
    - staticcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: SA1019
      - text: "ST1005:"
        linters:
          - staticcheck
      - text: "QF1001:"
        linters:
          - staticcheck
    paths:
      - third_party$
      - builtin$
      - examples$
      - avi/resource_avi_rest_dependants\.go$

  settings:
    errcheck:
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - fmt:.*
        - io:Close

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - avi/resource_avi_rest_dependants\.go$